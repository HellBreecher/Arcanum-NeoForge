plugins {
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" apply false
}

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(25)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build the separate NeoForge and Fabric release jars.'
    dependsOn ':neoforge:build', ':fabric:build'
}

tasks.register('runDataAll') {
    group = 'arcanum runs'
    description = 'Runs NeoForge server and client data generation for all Arcanum resources.'
    dependsOn ':neoforge:syncCommonGeneratedResources', ':neoforge:syncNeoForgeGeneratedResources'
}

gradle.projectsEvaluated {
    project(':neoforge').tasks.named('runDataClient').configure {
        mustRunAfter project(':neoforge').tasks.named('runData')
    }
}
