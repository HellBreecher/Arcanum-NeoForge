plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-common"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
}

loom {
    runs {
        configureEach {
            ideConfigGenerated = false
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
